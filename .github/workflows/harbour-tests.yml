name: Harbour tests

on:
  pull_request:
    paths:
      - 'wallpapers/harbour/**'
      - '.github/workflows/harbour-tests.yml'
  push:
    paths:
      - 'wallpapers/harbour/**'
      - '.github/workflows/harbour-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallpapers/harbour
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"
